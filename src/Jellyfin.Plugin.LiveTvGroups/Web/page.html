<div id="ltvg-entry" class="padded-top">
    <h1>Live-TV Control Center</h1>
    <p role="status">Opening groups…</p>
    <button type="button" class="raised emby-button" hidden>Try again</button>
</div>
<script>
(function () {
    const t = key => window.LiveTvGroupsI18n?.t(key) || key;
    var root = document.getElementById('ltvg-entry');
    window.LiveTvGroupsI18n?.translate(root);
    var button = root.querySelector('button');
    function open() {
        button.hidden = true;
        ApiClient.getJSON(ApiClient.getUrl('LiveTvGroups/Entry')).then(function (entry) {
            if (!root.isConnected) return;root.querySelector('h1').textContent=entry.DisplayName || t('Live-TV Control Center');
            if (!entry.ChannelId) throw new Error(t("Groups are unavailable. Check the plugin settings."));
            window.location.hash = '#/list?parentId=' + encodeURIComponent(entry.ChannelId) + '&serverId=' + encodeURIComponent(ApiClient.serverId()) + '&liveTvGroups=1';
        }).catch(function (error) {
            root.querySelector('[role="status"]').textContent = error.message || t("Could not open groups.");
            button.hidden = false;
        });
    }
    button.onclick = open;
    open();
})();
</script>
