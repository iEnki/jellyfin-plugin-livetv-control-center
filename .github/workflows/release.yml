name: Release

# Push a tag like v1.0.0 to build the plugin, publish a GitHub release
# and add the version to manifest.json (the Jellyfin plugin repository).
on:
  push:
    tags: ['v*', '!v*-dev']

permissions:
  contents: write

env:
  TARGET_ABI: '12.0.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify stable branch
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo 'Stable tags must reference a commit on main.' >&2; exit 1; }

      - name: Determine version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Jellyfin expects four-part versions.
          while [ "$(echo "$version" | tr -cd '.' | wc -c)" -lt 3 ]; do version="$version.0"; done
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a four-part plugin version." >&2; exit 1
          fi
          project_version="$(dotnet msbuild src/Jellyfin.Plugin.LiveTvGroups -getProperty:Version)"
          informational_version="$(dotnet msbuild src/Jellyfin.Plugin.LiveTvGroups -getProperty:InformationalVersion)"
          if [ "$version" != "$project_version" ] || [[ "$informational_version" == *-dev* ]]; then
            echo "Stable tag must match the project version and contain no development marker." >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --configuration Release

      - name: Check client and package metadata
        run: |
          node --check src/Jellyfin.Plugin.LiveTvGroups/Web/client.js
          npm run test:packaging

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test independent groups page
        run: npm run test:web

      - name: Build
        run: |
          dotnet publish src/Jellyfin.Plugin.LiveTvGroups --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} --output out
          node .github/scripts/write-dev-meta.cjs out
          zip -j "live-tv-groups_${{ steps.version.outputs.version }}.zip" out/Jellyfin.Plugin.LiveTvGroups.dll out/meta.json

      - name: Extract changelog
        run: |
          # Section "## X.Y.Z" of CHANGELOG.md for this tag.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > release-notes.md; fi
          cp release-notes.md "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "live-tv-groups_${{ steps.version.outputs.version }}.zip" \
            --title "Live-TV Groups ${GITHUB_REF_NAME}" --notes-file release-notes.md

      - name: Update manifest.json
        run: |
          git checkout main
          version="${{ steps.version.outputs.version }}"
          zip="live-tv-groups_${version}.zip"
          checksum="$(md5sum "$zip" | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${zip}"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg v "$version" --arg abi "$TARGET_ABI" --arg url "$url" --arg sum "$checksum" --arg ts "$timestamp" \
             --rawfile log "$RUNNER_TEMP/release-notes.md" \
             '.[0].versions = ([{version: $v, changelog: $log, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}]
                + (.[0].versions | map(select(.version != $v))))' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add version ${version} to manifest"
          git push origin main

      - name: Attach manifest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # raw.githubusercontent.com is cached by a CDN; the release asset of the latest release is always current.
        run: gh release upload "${GITHUB_REF_NAME}" manifest.json --clobber

      - name: Refresh manifest-dev.json
        env:
          GH_TOKEN: ${{ github.token }}
        # Development builds older than this release are dropped from the dev channel.
        run: bash .github/scripts/update-dev-manifest.sh manifest.json
