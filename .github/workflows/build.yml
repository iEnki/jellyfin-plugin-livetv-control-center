name: Build

on:
  push:
    branches: [main, dev, "dev-*"]
    paths-ignore: ['**/*.md', 'manifest.json']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test --configuration Release
      - name: Check client script syntax
        run: node --check src/Jellyfin.Plugin.LiveTvGroups/Web/client.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test independent groups page
        run: npm run test:web

      - name: Test package metadata
        run: npm run test:packaging
      - name: Build test plugin
        run: dotnet publish src/Jellyfin.Plugin.LiveTvGroups --configuration Release --no-restore --output out
      - name: Write installation metadata
        run: node .github/scripts/write-dev-meta.cjs out
      - uses: actions/upload-artifact@v4
        with:
          name: live-tv-groups-dev
          path: |
            out/Jellyfin.Plugin.LiveTvGroups.dll
            out/meta.json
          if-no-files-found: error
